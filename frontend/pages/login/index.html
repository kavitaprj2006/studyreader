<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyReader — Login</title>
  <link rel="stylesheet" href="../../styles/auth.css">
  <script src="../../scripts/config.js"></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="brand-header">
        <div class="brand-mark">S</div>
        <span class="brand-name">StudyReader</span>
      </div>
      <h1 id="login-title">Welcome Back</h1>
      <p class="subtitle">Log in to continue your learning and access your study resources.</p>

      <form id="login-form" novalidate>
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" placeholder="name@college.edu" autocomplete="email" required>

        <label for="password">Password</label>
        <div class="password-row">
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" id="toggle-password" class="secondary">Show</button>
        </div>

        <p id="form-message" class="message" role="alert" aria-live="polite"></p>
        <button id="submit-button" type="submit">Log In</button>
      </form>

      <p class="switch">Don't have an account? <a href="../signup/index.html">Sign up</a></p>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
